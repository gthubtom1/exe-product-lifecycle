schema_version: 1
product_id: "__PRODUCT_ID__"
track: "source"
# 需求录入（源码复用·二开入口的起点）。用普通话写清：要做什么、成功长什么样、明确不做什么、
# 以及是否要对外发布。status 未定(PENDING)时可以停在 SOURCE_INTAKE；写清后置 DEFINED 才能进入下一步。
status: "PENDING"                 # PENDING -> DEFINED
goal: ""                          # 一句话：要做出什么（用户视角）
success_criteria: []              # 可判定的成功标准（用户能亲手测的）
non_goals: []                     # 明确不做，避免范围蔓延
# distribution 只作信息记录：internal=自用；external=打算对外发布。本流程是"学写法、不整包合并别人代码"，
# 是否做许可检查与版权提醒由宿主与当前任务按需决定，不设任何阻塞式许可证门；只保留一句轻量供应链安全提示（保护机器、非版权，见 REFERENCE-INVENTORY）。
distribution: "internal"          # internal | external（仅信息记录，无阻塞门）
notes: ""
source_of_truth: "product-state/source/SOURCE-INTAKE.yaml"
