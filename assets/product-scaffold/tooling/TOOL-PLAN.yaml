schema_version: 1
product_id: "__PRODUCT_ID__"
selection_status: "PENDING"
inventory: "product-state/tooling/TOOL-INVENTORY.json"
rules:
  - role: "pe-triage"
    tool_id: "UNVERIFIED"
    path: "UNVERIFIED"
    version: "UNVERIFIED"
    reason: "先识别文件格式、架构和运行时"
  - role: "static-analysis"
    tool_id: "UNVERIFIED"
    path: "UNVERIFIED"
    version: "UNVERIFIED"
    reason: "根据 PE 类型选择原生、.NET、Electron 或资源工具"
  - role: "dynamic-observation"
    tool_id: "UNVERIFIED"
    path: "UNVERIFIED"
    version: "UNVERIFIED"
    reason: "仅在受控验证阶段使用"
  - role: "build-release"
    tool_id: "UNVERIFIED"
    path: "UNVERIFIED"
    version: "UNVERIFIED"
    reason: "构建或发布前再选择"
evidence_requirements:
  - "记录输入、命令、输出和退出状态"
  - "记录实际路径和版本，不使用猜测路径"
